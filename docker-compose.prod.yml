services:
  prit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prit
    restart: always
    environment:
      DATABASE_URL: postgres://postgres:prit-is-the-skit@db:5432/prit
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: prit-is-the-skit-changeme
    ports:
      - "3000:3000"
    depends_on:
      - db
  db:
    image: postgres:18-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prit-is-the-skit
      POSTGRES_DB: prit
    ports:
      - "5432:5432"
