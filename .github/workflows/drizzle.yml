name: Drizzle

on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "src/db/**"
  pull_request:
    branches: [main]
    paths:
      - "drizzle/**"
      - "src/db/**"

jobs:
  check-migrations:
    name: Verify schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.0-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: yarn global add drizzle-kit@1.0.0-rc.4 drizzle-orm@1.0.0-rc.4

      - name: Check migration history consistency
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        run: drizzle-kit check

      - name: Check migration drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        run: |
          drizzle-kit generate &&
          git add -N drizzle && git diff --exit-code drizzle
